<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx 週邊商品預購計算表</title>
    <!-- 引入 Tailwind CSS 與 Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS (xlsx) 用於前端讀取與生成 Excel 檔 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            position: relative;
            min-height: 100vh;
        }
        /* 固定且淡化的背景圖設定 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.2;
            z-index: -1;
        }
        /* 圖片懸浮放大時的特殊樣式（往右下方展開，不被表格限制） */
        .img-container {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 0 auto;
        }
        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            transform-origin: top left;
            z-index: 10;
        }
        .img-container img:hover {
            transform: scale(3.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            z-index: 50;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-800 py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <!-- 頁面標題（半透明毛玻璃效果） -->
        <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">✨ Jinx 週邊商品預購計算表</h1>
                <p class="text-sm text-slate-600 mt-1">請在下方欄位輸入您想要的購買數量，系統將自動幫您即時計算總金額、滿額贈品與檢查限購數量。</p>
            </div>
            <!-- 總金額與滿額贈品顯示卡片 -->
            <div class="bg-indigo-50/80 backdrop-blur-sm border border-indigo-100/60 rounded-xl px-6 py-4 flex flex-col gap-3 min-w-[280px]">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-xs text-indigo-600 font-medium">總計金額 (KRW)</div>
                        <div id="grandTotal" class="text-2xl font-bold text-indigo-900">0</div>
                        <!-- 新增：台幣 TWD 金額（字體較小、顏色刷淡） -->
                        <div id="twdTotal" class="text-xs text-slate-400 mt-0.5 font-normal">約 NT$ 0 (TWD)</div>
                    </div>
                    <!-- 按鈕群組：清除、匯入、匯出 Excel -->
                    <div class="flex flex-col gap-1.5">
                        <button onclick="resetForm()" class="bg-white/80 hover:bg-white text-indigo-600 text-xs px-3 py-1 rounded-lg border border-indigo-200 transition font-medium shadow-sm">
                            清除全部
                        </button>
                        <!-- 隱藏的檔案上傳 input -->
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                        <button onclick="document.getElementById('excelFile').click()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1 rounded-lg transition font-medium shadow-sm flex items-center justify-center gap-1">
                            📂 匯入 Excel
                        </button>
                        <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1 rounded-lg transition font-medium shadow-sm flex items-center justify-center gap-1">
                            📊 匯出 Excel
                        </button>
                    </div>
                </div>
                <!-- 滿額贈品顯示區塊（分兩排） -->
                <div class="border-t border-indigo-100/80 pt-2 flex flex-col gap-1.5 text-xs font-medium text-slate-700">
                    <div id="gift5w" class="flex items-center gap-1.5">
                        <span>📷</span> <span>5萬滿額親密相卡：0 張</span>
                    </div>
                    <div id="gift10w" class="flex items-center gap-1.5">
                        <span>🃏</span> <span>10萬滿額小卡+透卡組：0 組</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品表格卡片（半透明毛玻璃效果） -->
        <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/60 text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200/60">
                            <th class="py-3 px-4 font-semibold w-20 text-center">商品圖</th>
                            <th class="py-3 px-4 font-semibold">商品名稱</th>
                            <th class="py-3 px-4 font-semibold">類別</th>
                            <th class="py-3 px-4 font-semibold text-right">單價</th>
                            <th class="py-3 px-4 font-semibold text-center">購買數量</th>
                            <th class="py-3 px-4 font-semibold text-center">限購數量</th>
                            <th class="py-3 px-4 font-semibold text-right">單項總價</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-200/40 text-sm">
                        <!-- 動態生成商品列 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="text-center text-xs text-slate-500 mt-6 font-medium drop-shadow-sm">
            本網頁僅供個人試算使用，所有輸入資料皆僅存於您的裝置中，不會發送或回傳至任何伺服器。
        </div>
    </div>

    <script>
        const products = [
            { name: "트라이엄프 아크릴 스탠드", category: "壓克力立牌", price: 28000, limit: 5 },
            { name: "데이트 아크릴 스탠드 (재경)", category: "壓克力立牌", price: 19000, limit: 5, isSplit: true },
            { name: "데이트 아크릴 스탠드 (단)", category: "壓克力立牌", price: 19000, limit: 5, isSplit: true },
            { name: "어린이 아크릴 스탠드 (재경)", category: "壓克力立牌", price: 12000, limit: 5, isSplit: true },
            { name: "어린이 아크릴 스탠드 (단)", category: "壓克力立牌", price: 12000, limit: 5, isSplit: true },
            { name: "밍그래 아크릴 블록", category: "飯友(韓國限定)", price: 15000, limit: 3 },
            { name: "컬렉션 포토카드 ver.3 [랜덤]", category: "小卡, 盲抽", price: 5000, limit: 20 },
            { name: "컬렉션 미니 블록 [랜덤]", category: "小壓克力, 盲抽", price: 6500, limit: 5 },
            { name: "컬렉션 미니 스탠드 [랜덤]", category: "小壓克力, 盲抽", price: 4200, limit: 10 },
            { name: "캔뱃지 세트", category: "徽章", price: 9000, limit: 5 },
            { name: "어린이 캔뱃지 세트", category: "徽章", price: 9000, limit: 5 },
            { name: "경단스튜디오 데이트 사진팩 [랜덤]", category: "拍立得, 盲抽", price: 5000, limit: 20 },
            { name: "MFC 주재경 선수 슬로건", category: "手幅, 盲抽", price: 18000, limit: 5 },
            { name: "주재경 글러브 키링", category: "吊飾", price: 21000, limit: 3 },
            { name: "주재경의 성장 기록 패키지", category: "照片組, 吊飾", price: 20000, limit: 3 },
            { name: "김단의 성장 기록 패키지", category: "照片組, 吊飾", price: 20000, limit: 3 },
            { name: "주재경 트레이딩 카드팩 [랜덤]", category: "照片組, 盲抽", price: 4000, limit: 10 },
            { name: "엽서 세트", category: "照片組", price: 18000, limit: 10 },
            { name: "허그베어 필름 패키지 [부분 랜덤]", category: "四格, 盲抽", price: 10500, limit: 10 },
            { name: "늑대 재경 쿠션", category: "抱枕", price: 30000, limit: 3 },
            { name: "햄찌 단이 쿠션", category: "抱枕", price: 30000, limit: 3 },
            { name: "LED 옥타곤 디오라마", category: "場景壓克力", price: 33000, limit: 10 },
            { name: "김단 선생의 징명사진 패키지 [랜덤]", category: "吊飾, 盲抽", price: 7000, limit: 10 },
            { name: "미니 쿠션 키링 [랜덤]", category: "吊飾, 盲抽", price: 7700, limit: 10 },
            { name: "마우스 패드 패키지", category: "滑鼠墊", price: 30000, limit: 5 },
            { name: "트라이엄프 포스터", category: "海報", price: 11000, limit: 3 },
            { name: "주재경 빅 쿠션 커버", category: "抱枕", price: 38000, limit: 5 },
            { name: "블랭킷", category: "毯子?", price: 30000, limit: 5 },
            { name: "뽀시래기 MFC 선수복", category: "娃衣", price: 15000, limit: 3 },
            { name: "뽀시래기 물리치료사 유니폼", category: "娃衣", price: 23000, limit: 3 },
            { name: "뽀시래기 동물 모자 세트", category: "娃衣", price: 23000, limit: 3 },
            { name: "팀블랙 더플백", category: "行李袋組", price: 105000, limit: 3 },
            { name: "팀블랙 폴로 셔츠", category: "衣服", price: 62000, limit: 3 },
            { name: "징크스 (1권/2권) 각", category: "書", price: 16200, limit: 3 }
        ];

        let currentGrandTotal = 0;
        let currentGift5w = 0;
        let currentGift10w = 0;
        const KRW_TO_TWD_RATE = 0.02296; // Google 即期匯率參考值

        function renderTable() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            
            products.forEach((p, index) => {
                let originalIndex = index;
                if (p.name === "데이트 아크릴 스탠드 (단)") originalIndex = 1;
                if (p.name === "어린이 아크릴 스탠드 (재경)") originalIndex = 2;
                if (p.name === "어린이 아크릴 스탠드 (단)") originalIndex = 2;
                if (index > 3) originalIndex = index - 2;

                const fileNum = String(originalIndex + 1).padStart(3, '0');
                const imgFileName = `${fileNum}.jpg`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <div class="img-container">
                            <img src="${imgFileName}" alt="${p.name}" 
                                class="w-12 h-12 object-cover rounded-lg border border-slate-200/60 shadow-sm cursor-pointer" 
                                onerror="this.src='https://via.placeholder.com/48?text=No+Img'">
                        </div>
                    </td>
                    <td class="py-3 px-4 font-medium text-slate-800">${p.name}</td>
                    <td class="py-3 px-4 text-slate-600">${p.category}</td>
                    <td class="py-3 px-4 text-right text-slate-700">${p.price.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">
                        <input type="number" id="qty_${index}" min="0" max="${p.limit}" value="0" 
                            oninput="calculateTotal()" 
                            class="w-20 text-center border border-slate-300 rounded-lg py-1 px-2 bg-white/90 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                    </td>
                    <td class="py-3 px-4 text-center text-slate-500 text-xs">${p.limit}</td>
                    <td id="subtotal_${index}" class="py-3 px-4 text-right font-semibold text-slate-800">0</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calculateTotal() {
            currentGrandTotal = 0;
            products.forEach((p, index) => {
                const qtyInput = document.getElementById(`qty_${index}`);
                let qty = parseInt(qtyInput.value) || 0;
                
                if (qty > p.limit) {
                    qty = p.limit;
                    qtyInput.value = qty;
                }
                if (qty < 0) {
                    qty = 0;
                    qtyInput.value = qty;
                }

                const subtotal = qty * p.price;
                currentGrandTotal += subtotal;
                
                document.getElementById(`subtotal_${index}`).innerText = subtotal.toLocaleString();
            });

            // 更新總金額 (KRW)
            document.getElementById('grandTotal').innerText = currentGrandTotal.toLocaleString();

            // 計算並更新總金額 (TWD)
            const twdTotal = Math.round(currentGrandTotal * KRW_TO_TWD_RATE);
            document.getElementById('twdTotal').innerText = `約 NT$ ${twdTotal.toLocaleString()} (TWD)`;

            currentGift5w = currentGrandTotal >= 50000 ? 1 : 0;
            currentGift10w = Math.floor(currentGrandTotal / 100000);
            if (currentGift10w > 4) {
                currentGift10w = 4;
            }

            document.getElementById('gift5w').innerHTML = `<span>📷</span> <span>5萬滿額親密相卡：${currentGift5w} 張</span>`;
            document.getElementById('gift10w').innerHTML = `<span>🃏</span> <span>10萬滿額小卡+透卡組：${currentGift10w} 組</span>`;
        }

        function resetForm() {
            products.forEach((p, index) => {
                document.getElementById(`qty_${index}`).value = 0;
            });
            calculateTotal();
        }

        function exportExcel() {
            let excelData = [];
            let hasItem = false;

            products.forEach((p, index) => {
                const qty = parseInt(document.getElementById(`qty_${index}`).value) || 0;
                if (qty > 0) {
                    hasItem = true;
                    const subtotal = qty * p.price;
                    excelData.push({
                        "商品名稱": p.name,
                        "類別": p.category,
                        "單價 (KRW)": p.price,
                        "購買數量": qty,
                        "單項總價 (KRW)": subtotal
                    });
                }
            });

            if (!hasItem) {
                alert("目前沒有選購任何商品喔！");
                return;
            }

            const twdTotal = Math.round(currentGrandTotal * KRW_TO_TWD_RATE);

            excelData.push({});
            excelData.push({ "商品名稱": "=== 結算資訊 ===" });
            excelData.push({ "商品名稱": "總金額 (KRW)", "類別": currentGrandTotal });
            excelData.push({ "商品名稱": "總金額 (TWD 預估)", "類別": `NT$ ${twdTotal}` });
            excelData.push({ "商品名稱": "5萬滿額親密相卡", "類別": `${currentGift5w} 張` });
            excelData.push({ "商品名稱": "10萬滿額小卡+透卡組", "類別": `${currentGift10w} 組` });

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "預購清單");

            const colWidths = [
                {wch: 35},
                {wch: 15},
                {wch: 15},
                {wch: 10},
                {wch: 18}
            ];
            worksheet['!cols'] = colWidths;

            XLSX.writeFile(workbook, "jinx_order_summary.xlsx");
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    products.forEach((p, index) => {
                        document.getElementById(`qty_${index}`).value = 0;
                    });

                    let matchCount = 0;
                    json.forEach(row => {
                        const name = row["商品名稱"];
                        const qty = parseInt(row["購買數量"]) || 0;

                        if (name && qty > 0) {
                            const productIndex = products.findIndex(p => p.name === name);
                            if (productIndex !== -1) {
                                document.getElementById(`qty_${productIndex}`).value = qty;
                                matchCount++;
                            }
                        }
                    });

                    calculateTotal();
                    if (matchCount > 0) {
                        alert(`成功匯入！已自動載入 ${matchCount} 項商品的購買數量。`);
                    } else {
                        alert("未能識別檔案中的商品資料，請確認是否為正確的預購清單 Excel 檔。");
                    }
                } catch (error) {
                    console.error(error);
                    alert("讀取 Excel 檔案時發生錯誤，請確認檔案格式是否正確。");
                }
                
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        renderTable();
    </script>
</body>
</html>
